<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Temple Album</title>
    <meta name="description"
        content="A collection of temples from around the world that I chose based off of the appearance of their architecture and the surrounding beauty." />
    <meta name="author" content="Caleb J. Erickson" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles/temples.css">
    <link rel="stylesheet" href="styles/temples-large.css">
    <script src="scripts/temples.js" defer></script>
</head>

<body>

    <header>
        <h2>Temple Album</h2>
        <button id="menu"></button>
        <nav class="navigation">
            <a href="#">Home</a>
            <a href="#">Old</a>
            <a href="#">New</a>
            <a href="#">Large</a>
            <a href="#">Small</a>
        </nav>
    </header>

    <main>
        <h1>Home</h1>
        <div class="gallery">
            <figure>
                <img src="images/albuquerque_nm_temple.jpg" alt="Temple" loading="lazy">
                <figcaption>Albuquerque New Mexico</figcaption>
            </figure>
            <figure>
                <img src="images/arequipa_peru_temple.jpg" alt="Temple" loading="lazy">
                <figcaption>Arequipa Peru</figcaption>
            </figure>
            <figure>
                <img src="images/asuncion_paraguay_temple.jpg" alt="Temple" loading="lazy">
                <figcaption>Asuncion Paraguay</figcaption>
            </figure>
            <figure>
                <img src="images/barranquilla_temple.jpg" alt="Temple" loading="lazy">
                <figcaption>Barranquilla Colombia</figcaption>
            </figure>
            <figure>
                <img src="images/bern_switzerland_temple.jpg" alt="Temple" loading="lazy">
                <figcaption>Bern Switzerland</figcaption>
            </figure>
            <figure>
                <img src="images/cedarcity_utah_temple.jpg" alt="Temple" loading="lazy">
                <figcaption>Cedar City Utah</figcaption>
            </figure>
            <figure>
                <img src="images/provocitycenter_temple.jpg" alt="Temple" loading="lazy">
                <figcaption>Provo City Center Utah</figcaption>
            </figure>
            <figure>
                <img src="images/rome_italy_temple.jpg" alt="Temple" loading="lazy">
                <figcaption>Rome Italy</figcaption>
            </figure>
            <figure>
                <img src="images/washingtondc_temple.jpg" alt="Temple" loading="lazy">
                <figcaption>Washington D.C.</figcaption>
            </figure>
        </div>
    </main>

    <footer>
        <p>&copy; <span id="currentyear"></span> Caleb J. Erickson - United States of America</p>
        <p><span id="lastModified"></span></p>
    </footer>

</body>

</html>
