<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Review Form</title>
    <meta name="description"
        content="A webpage project for a simple product review form for users to submit their feedback." />
    <meta name="author" content="Caleb J. Erickson" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@100..900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styles/form.css">

    <script src="scripts/form.js" defer></script>
</head>

<body>
    <header>
        <h1>Product Review</h1>
    </header>

    <main>
        <form method="get" action="review.html" id="reviewForm">
            <label for="reviewDate">Review Date</label>
            <input type="date" id="reviewDate" name="reviewDate" required>
            <label for="product">Product Name</label>

            <select id="product" name="product" required>
                <option value="" disabled selected>Select a Product ...</option>
            </select>

            <fieldset class="rating">
                <legend>Overall Rating</legend>

                <input type="radio" id="r1" name="rating" value="1" required>
                <label for="r1">☆</label>

                <input type="radio" id="r2" name="rating" value="2" required>
                <label for="r2">☆☆</label>

                <input type="radio" id="r3" name="rating" value="3" required>
                <label for="r3">☆☆☆</label>

                <input type="radio" id="r4" name="rating" value="4" required>
                <label for="r4">☆☆☆☆</label>

                <input type="radio" id="r5" name="rating" value="5" required>
                <label for="r5">☆☆☆☆☆</label>
            </fieldset>


            <fieldset>
                <legend>Useful Features</legend>

                <input type="checkbox" id="durability" name="features" value="durability">
                <label for="durability">Durability</label>

                <input type="checkbox" id="ease" name="features" value="ease">
                <label for="ease">Ease of Use</label>

                <input type="checkbox" id="performance" name="features" value="performance">
                <label for="performance">Performance</label>

                <input type="checkbox" id="design" name="features" value="design">
                <label for="design">Design</label>
            </fieldset>

            <label for="review">Written Review (Optional)</label>
            <textarea id="review" name="review"></textarea>

            <label for="username">Your Name (Optional)</label>
            <input type="text" id="username" name="username">

            <input type="submit" value="Post Review">
        </form>

    </main>

    <footer>
        <p>&copy; <span id="currentyear"></span> Caleb J. Erickson - United States of America</p>
        <p><span id="lastModified"></span></p>
    </footer>

</body>

</html>
